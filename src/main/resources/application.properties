spring.application.name=currency-parser
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/currency-rates;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.datasource.hikari.maximum-pool-size=4
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mvc.problemdetails.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
collector.scheduling-enabled=true
collector.initial-delay-ms=1000
collector.interval-ms=3600000
