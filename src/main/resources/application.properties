spring.application.name=currency-parser
server.port=8080
server.compression.enabled=false
spring.datasource.url=jdbc:h2:file:./data/currency-rates;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.datasource.hikari.maximum-pool-size=4
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mvc.problemdetails.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
collector.scheduling-enabled=true
collector.initial-delay-ms=1000
collector.interval-ms=3600000
collector.files-directory=./data

# По умолчанию Redis не требуется. Для варианта B: --spring.cache.type=redis
spring.cache.type=caffeine
spring.cache.cache-names=rates
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=600s,recordStats
spring.cache.redis.time-to-live=10m
spring.cache.redis.key-prefix=currency-parser:v1:
spring.cache.redis.cache-null-values=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
